name: Infra CI / CD Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare workspace
    runs-on: ubuntu-latest
    outputs:
      workspace-path: ${{ steps.set-out.outputs.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set workspace output
        id: set-out
        run: |
          echo "::set-output name=workspace::${GITHUB_WORKSPACE}/infra/terraform/envs/prod"

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/*.sh || true

  validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Run terraform_setup.sh
        run: ./scripts/terraform_setup.sh "${{ github.workspace }}/infra/terraform/envs/prod"

      - name: Terraform fmt (check)
        run: |
          cd infra/terraform/envs/prod
          terraform fmt -check -diff

      - name: Terraform init & validate
        run: |
          cd infra/terraform/envs/prod
          terraform init -input=false
          terraform validate

  plan:
    name: Terraform plan (PR & pushes)
    runs-on: ubuntu-latest
    needs: [validate]
    outputs:
      plan-artifact: ${{ steps.upload.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Run terraform_plan.sh
        id: run-plan
        run: |
          cd infra/terraform/envs/prod
          ./../../../../scripts/terraform_plan.sh > plan.log 2>&1 || true
          # Ensure a plan file exists if script created one
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan.txt || true
          elif [ -f tfplan.binary ]; then
            terraform show -no-color tfplan.binary > plan.txt || true
          fi
          ls -lah

      - name: Upload plan & logs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infra/terraform/envs/prod/plan.txt
            infra/terraform/envs/prod/tfplan*
            infra/terraform/envs/prod/plan.log

      - name: Comment plan summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@6
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/envs/prod/plan.txt';
            let body = 'Terraform plan generated by workflow. See attached artifacts for full plan.';
            if (fs.existsSync(path)) {
              const txt = fs.readFileSync(path, 'utf8').slice(0, 12000);
              body += `\n\n\`\`\`\n${txt}\n\`\`\``;
            }
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  security_scan:
    name: Security static scan (Checkov)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node (for comment script)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Checkov scanner
        run: ./scripts/checkov-scan.sh infra/terraform/envs/prod

      - name: Parse Checkov report
        run: ./scripts/parse-checkov-report.sh infra/terraform/envs/prod

      - name: Comment Checkov results (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@6
        with:
          script: |
            const fs = require('fs');
            const report = 'infra/terraform/envs/prod/checkov-report.md';
            let body = 'Checkov scan results:';
            if (fs.existsSync(report)) {
              body += '\n\n' + fs.readFileSync(report, 'utf8').slice(0, 12000);
            } else {
              body += '\n\n_No report generated._';
            }
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: Terraform apply (Protected)
    runs-on: ubuntu-latest
    needs: [plan, security_scan]
    environment:
      name: production
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/terraform/envs/prod/artifacts || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Run terraform_apply.sh (uses protected env approval)
        env:
          TF_VAR_example: ${{ secrets.TF_VAR_EXAMPLE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cd infra/terraform/envs/prod
          # If a plan file exists, apply it. Otherwise fall back to a fresh apply.
          if [ -f tfplan ] || [ -f tfplan.binary ] || [ -d artifacts ]; then
            if [ -f tfplan ]; then
              ./../../../../scripts/terraform_apply.sh tfplan
            elif [ -f tfplan.binary ]; then
              ./../../../../scripts/terraform_apply.sh tfplan.binary
            else
              # attempt to find uploaded plan
              for f in artifacts/*; do
                if [[ $f == *tfplan* ]]; then
                  ./../../../../scripts/terraform_apply.sh "$f"
                  exit 0
                fi
              done
              echo "No plan found, running terraform apply (plan will be recreated)."
              ./../../../../scripts/terraform_apply.sh
            fi
          else
            echo "No plan artifact found — running terraform apply directly"
            ./../../../../scripts/terraform_apply.sh
          fi