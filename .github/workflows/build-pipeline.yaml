name: Terraform CI / CD Pipeline


on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/build-pipeline.yaml'

  push:
    paths:
      - 'terraform/**'
      - 'scripts/*'
      - '.github/workflows/build-pipeline.yaml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: string
      terraform_dir:
        description: 'Terraform Directory'
        required: false
        default: 'terraform/envs/dev'
        type: string

env:
  AWS_REGION: 'us-east-1'
  TF_VERSION: '1.10.0-1'
  S3_BACKEND_BUCKET: ${{ secrets.S3_BACKEND_BUCKET }}

jobs:
  security-scan:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull_request: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov security scan
        id: checkov
        run: |
          chmod +x scripts/checkov_scan.sh
          ./scripts/checkov_scan.sh terraform/dev
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload Checkov report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: checkov-security-report
          path: ${{ github.workspace }}/checkov_report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Comment PR with checkov Results
        if: ${{ github.event_name == 'pull_request' && always() }}
        run: |
          chmod +x scripts/comment_checkov_results.sh
          ./scripts/comment_checkov_results.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}




  terraform-plan:
    # Run terraform plan for pull requests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    concurrency: terraform-state
    permissions:
      id-token: write
      contents: read
      pull_request: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set Terraform Directory
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            case "${{ github.base_ref }}" in
              "develop")
                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
                ;;
              "staging")
                echo "TERRAFORM_DIR=terraform/envs/staging" >> $GITHUB_ENV
                ;;
              "main")
                echo "TERRAFORM_DIR=terraform/envs/prod" >> $GITHUB_ENV
                ;;
              *)
                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
                ;;
            esac
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TERRAFORM_DIR=${{ inputs.terraform_dir }}" >> $GITHUB_ENV
          else
            echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
          fi

      ## Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        run: |
          chmod +x scripts/terraform_setup.sh
          ./scripts/terraform_setup.sh
        env:
          TF_VERSION: ${{ env.TF_VERSION }}

      - name: terraform plan
        run: |
          chmod +x scripts/terraform_plan.sh
          ./scripts/terraform_plan.sh
        env:
          TERRAFORM_DIR: ${{ env.TERRAFORM_DIR }}

      - name: upload plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{env.TERRAFORM_DIR}}/terraform-plan.log
          retention-days: 1

  terraform-apply:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    concurrency: terraform-state
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set Terraform Directory
        run: |

          if [ "${{ github.event_name }}" == "push" ]; then

            case "${{ github.ref }}" in

              "refs/heads/develop")

                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV

                ;;

              "refs/heads/staging")

                echo "TERRAFORM_DIR=terraform/envs/staging" >> $GITHUB_ENV

                ;;

              "refs/heads/main")

                echo "TERRAFORM_DIR=terraform/envs/prod" >> $GITHUB_ENV

                ;;

              *)

                echo "Unsupported branch for apply"

                exit 1

                ;;

            esac

          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then

            if [ "${{ inputs.action }}" == "apply" ]; then

              echo "TERRAFORM_DIR=${{ inputs.terraform_dir }}" >> $GITHUB_ENV

            else

              echo "Action is not apply, skipping terraform apply"

              exit 0

            fi

          fi

      ## Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        run: |
          chmod +x scripts/terraform_setup.sh
          ./scripts/terraform_setup.sh
        env:
          TF_VERSION: ${{ env.TF_VERSION }}

      - name: terraform apply
        run: |
          chmod +x scripts/terraform_apply.sh
          ./scripts/terraform_apply.sh
        env:
          TERRAFORM_DIR: ${{ env.TERRAFORM_DIR }}
      
      - name: upload apply log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-logs
          path: ${{env.TERRAFORM_DIR}}/terraform-apply.log
          retention-days: 30
