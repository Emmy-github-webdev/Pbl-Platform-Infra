name: Terraform CI/CD

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Detect environment
    - name: Set environment
      id: env
      run: |
        if [[ "${GITHUB_REF}" == "refs/heads/develop" || "${{ github.base_ref }}" == "develop" ]]; then
          echo "dir=environments/dev" >> $GITHUB_OUTPUT
          echo "role=${{ secrets.AWS_ROLE_DEV }}" >> $GITHUB_OUTPUT
        elif [[ "${GITHUB_REF}" == "refs/heads/staging" || "${{ github.base_ref }}" == "staging" ]]; then
          echo "dir=environments/staging" >> $GITHUB_OUTPUT
          echo "role=${{ secrets.AWS_ROLE_STAGING }}" >> $GITHUB_OUTPUT
        else
          echo "dir=environments/prod" >> $GITHUB_OUTPUT
          echo "role=${{ secrets.AWS_ROLE_PROD }}" >> $GITHUB_OUTPUT
        fi

    - name: Debug OIDC availability
      run: |
        echo "TOKEN URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
        echo "TOKEN TOKEN: $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
        
    # AWS OIDC login
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.env.outputs.role }}
        aws-region: ${{ env.AWS_REGION }}

    # Setup Terraform
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    # Terraform steps
    - run: terraform init
      working-directory: ${{ steps.env.outputs.dir }}

    - run: terraform fmt -check -recursive

    - run: terraform validate
      working-directory: ${{ steps.env.outputs.dir }}

    # Security scan
    - name: Checkov Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: .

    # Terraform plan (PR only)
    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color > plan.txt
      working-directory: ${{ steps.env.outputs.dir }}

    # Comment Terraform plan
    - name: Comment Plan
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: ${{ steps.env.outputs.dir }}/plan.txt

    # Infracost (modern usage)
    - name: Setup Infracost
      if: github.event_name == 'pull_request'
      uses: infracost/actions/setup@v2

    - name: Infracost Breakdown
      if: github.event_name == 'pull_request'
      run: |
        infracost breakdown \
          --path=${{ steps.env.outputs.dir }} \
          --format=json \
          --out-file=infracost.json

    - name: Infracost Comment
      if: github.event_name == 'pull_request'
      run: |
        infracost comment github \
          --path=infracost.json \
          --repo=$GITHUB_REPOSITORY \
          --github-token=${{ secrets.GITHUB_TOKEN }} \
          --pull-request=${{ github.event.pull_request.number }}
      env:
        INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    # Apply (push only)
    - name: Terraform Apply
      if: github.event_name == 'push'
      run: terraform apply -auto-approve
      working-directory: ${{ steps.env.outputs.dir }}