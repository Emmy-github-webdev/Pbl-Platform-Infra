name: Terraform CI/CD

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.env.outputs.dir }}
      role: ${{ steps.env.outputs.role }}
      skip: ${{ steps.env.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${GITHUB_REF##*/}"
          fi

          echo "Detected branch: $TARGET"

          case "$TARGET" in
            develop)
              echo "dir=terraform/environments/dev" >> $GITHUB_OUTPUT
              echo "role=${{ secrets.AWS_ROLE_DEV }}" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "dir=terraform/environments/staging" >> $GITHUB_OUTPUT
              echo "role=${{ secrets.AWS_ROLE_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "dir=terraform/environments/prod" >> $GITHUB_OUTPUT
              echo "role=${{ secrets.AWS_ROLE_PROD }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "⚠️ Skipping unsupported branch"
              echo "skip=true" >> $GITHUB_OUTPUT
              ;;
          esac


  terraform:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.dir }}

    steps:
      - uses: actions/checkout@v4

      # Debug OIDC availability
      - name: Debug OIDC availability
        run: |
          echo "TOKEN URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "TOKEN TOKEN: $ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      # Debug role
      - name: Debug role
        run: |
          echo "ROLE=${{ steps.env.outputs.role }}"

      # AWS OIDC login
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      # ✅ REAL OIDC VALIDATION (keep this!)
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true

      # PLAN (PR only)
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tfplan

      - name: Show Plan
        if: github.event_name == 'pull_request'
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment Plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: plan.txt

      # APPLY (push or manual)
      - name: Terraform Apply
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve

      # DESTROY (manual only)
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve