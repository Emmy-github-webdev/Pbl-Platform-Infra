build-pipeline.yaml
name: Terraform CI / CD Pipeline


on:
  pull_request:

  push:
    paths:
      - 'terraform/**'
      - 'scripts/*'
      - '.github/workflows/build-pipeline.yaml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: string
      terraform_dir:
        description: 'Terraform Directory'
        required: false
        default: 'terraform/envs/dev'
        type: string

env:
  AWS_REGION: 'us-east-1'
  TF_VERSION: '1.10.0-1'
  S3_BACKEND_BUCKET: ${{ secrets.S3_BACKEND_BUCKET }}

jobs:
  security-scan:
    if: ${{ contains('pull_request push workflow_dispatch', github.event_name) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull_request: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov security scan
        id: checkov
        run: |
          chmod +x scripts/checkov_scan.sh
          ./scripts/checkov_scan.sh terraform/dev
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload Checkov report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: checkov-security-report
          path: ${{ github.workspace }}/checkov_report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Comment PR with checkov Results
        if: ${{ github.event_name == 'pull_request' && always() }}
        run: |
          chmod +x scripts/comment_checkov_results.sh
          ./scripts/comment_checkov_results.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}




  terraform-plan:
    # Run terraform plan for pull requests
    if: ${{ contains('pull_request workflow_dispatch', github.event_name) }}
    runs-on: ubuntu-latest
    concurrency: terraform-state
    permissions:
      id-token: write
      contents: read
      pull_request: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set Terraform Directory
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            case "${{ github.base_ref }}" in
              "develop")
                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
                ;;
              "staging")
                echo "TERRAFORM_DIR=terraform/envs/staging" >> $GITHUB_ENV
                ;;
              "main")
                echo "TERRAFORM_DIR=terraform/envs/prod" >> $GITHUB_ENV
                ;;
              *)
                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
                ;;
            esac
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TERRAFORM_DIR=${{ inputs.terraform_dir }}" >> $GITHUB_ENV
          else
            echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV
          fi

      ## Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        run: |
          chmod +x scripts/terraform_setup.sh
          ./scripts/terraform_setup.sh
        env:
          TF_VERSION: ${{ env.TF_VERSION }}

      - name: terraform plan
        run: |
          chmod +x scripts/terraform_plan.sh
          ./scripts/terraform_plan.sh
        env:
          TERRAFORM_DIR: ${{ env.TERRAFORM_DIR }}

      - name: upload plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{env.TERRAFORM_DIR}}/terraform-plan.log
          retention-days: 1

  terraform-apply:
    if: ${{ contains('push workflow_dispatch', github.event_name) }}
    runs-on: ubuntu-latest
    concurrency: terraform-state
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set Terraform Directory
        run: |

          if [ "${{ github.event_name }}" == "push" ]; then

            case "${{ github.ref }}" in

              "refs/heads/develop")

                echo "TERRAFORM_DIR=terraform/envs/dev" >> $GITHUB_ENV

                ;;

              "refs/heads/staging")

                echo "TERRAFORM_DIR=terraform/envs/staging" >> $GITHUB_ENV

                ;;

              "refs/heads/main")

                echo "TERRAFORM_DIR=terraform/envs/prod" >> $GITHUB_ENV

                ;;

              *)

                echo "Unsupported branch for apply"

                exit 1

                ;;

            esac

          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then

            if [ "${{ inputs.action }}" == "apply" ]; then

              echo "TERRAFORM_DIR=${{ inputs.terraform_dir }}" >> $GITHUB_ENV

            else

              echo "Action is not apply, skipping terraform apply"

              exit 0

            fi

          fi

      ## Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        run: |
          chmod +x scripts/terraform_setup.sh
          ./scripts/terraform_setup.sh
        env:
          TF_VERSION: ${{ env.TF_VERSION }}

      - name: terraform apply
        run: |
          chmod +x scripts/terraform_apply.sh
          ./scripts/terraform_apply.sh
        env:
          TERRAFORM_DIR: ${{ env.TERRAFORM_DIR }}
      
      - name: upload apply log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-logs
          path: ${{env.TERRAFORM_DIR}}/terraform-apply.log
          retention-days: 30


checkov-scan.sh
#!/bin/bash

set -euo pipefail

TERRAFORM_DIR="${1:-.}"
SCRIPT_DIR="$(cd "$(dirname "$(BASH_SOURCE[0])")" && pwd)"

# Install checkov
pip install checkov -q

# Run checkov scan
echo "Running Checkov scan on Terraform directory: ${TERRAFORM_DIR}"
checkov -d "${TERRAFORM_DIR}" --compact --framework terraform --output > /tmp/checkov-output.txt 2>&1 || true

# Extract metrics
PASSED=$(grep -oP `(?<=Passed checks: )\d+` /tmp/checkov-output.txt || echo "0")
FAILED=$(grep -oP `(?<=Failed checks: )\d+` /tmp/checkov-output.txt || echo "0")
SKIPPED=$(grep -oP `(?<=Skipped checks: )\d+` /tmp/checkov-output.txt || echo "0")

# Output metrics to ITHUB_OUTPUTS
echo "passed=${PASSED}" >> "${GITHUB_OUTPUT}"
echo "failed=${FAILED}" >> "${GITHUB_OUTPUT}"
echo "skipped=${SKIPPED}" >> "${GITHUB_OUTPUT}"

# Save report for artifact
cp /tmp/checkov-output.txt checkov-report.txt

echo ""
echo "✓ Checkov scan completed"
echo "Passed: ${PASSED}"
echo "Failed: ${FAILED}"
echo "Skipped: ${SKIPPED}"

# Generate parsed report with color-coding and compliance scorecard
echo "Generating compliance scorecard..."
chmod +x "${SCRIPT_DIR}/parse-checkov-report.sh"
"${SCRIPT_DIR}/parse-checkov-report.sh" /tmp/checkov-output.txt checkov-report-parsed.txt

# Append parsed report to main report
cat "checkov-report-parsed.txt" >> checkov-report.txt

echo "✓ Compliance scorecard generated and appended to report"
echo " - checkov-report.txt (raw + parsed)"
echo " - checkov-report-parsed.txt (parsed only)"

comment_checkov_results.sh
#!/usr/bin/env node

/** 
* Comment PR with Checkov security Scan results
* Posts a formatted comment to the PR with the results of the Checkov scan, including a summary of findings and a link to the detailed report.
*
* Usage: node scripts/comment-checkov-results.js <passed> <failed> <skipped> <failedChecks>
**/

const github = require('@actions/github');
const core = require('@actions/core');

async function commentPRWithCheckovResults() {
    try {
        const passed = Process.env.CHECKOV_PASSED || 0;
        const failed = Process.env.CHECKOV_FAILED || 0;
        const skipped = Process.env.CHECKOV_SKIPPED || 0;
        const failedChecks = process.env.CHECKOV_FAILED_CHECKS || '';

        let emoji = '✅';
        let status = 'PASSED';

        if (parseInt(failed) > 0) {
            emoji = '⚠️';
            status = "PASSED WITH WARNINGS";
        }

        if (parseInt(failed) > 5) {
            emoji = '❌';
            status = "FAILED";
        }

        const summaryTable = `| Check Type | Count | Status |
|------------|-------|--------|
| ✅     | ${passed}   | Success |
| ❌     | ${failed}   | ${parseInt(failed) > 0 ? 'Action Required' : 'N/A'} |
| Ø    | ${skipped}   | Info |`;

        let failedDetails = '';
        if (parseInt(failed) > 0 && failedChecks && failedChecks.trim() !== '') {
            faileddetails = `### ❌ Failed Check details
\`\`\`
${failedChecks.trim()}
\`\`\`

`;
        }
        const comment = `## ${emoji} Checkov Security Scan - ${status}

### Summary
${summaryTable}

${failedDetails}**Overall result**: ${emoji}${status}

**Details**: See the \`Checkov-security-report artifact for the full scan report.`;
        const token = core.getInput('github-token');
        const octokit = github.getOctokit(token);

        const { context } = github;
        if (context.issue && context.issue.number) {
            await octokit.rest.issues.createComment({
                isue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
            });
            console.log('✅ Comment posted successfully');
        } else {
            console.warn('⚠️ No pull request context found. Skipping comment.');
        }
    } catch (error) {
        core.setFailed(`❌ Failed to post comment: ${error.message}`);
        process.exit(1);
    }
}

commentPRWithCheckovResults();


terraform_setup.sh
#!/bin/bash

# Terraform CLI Installation

echo "Installing Terraform CLI..."

# Install HashiCorp GPG key
wget -o- https://apt.releases.hashicorp.com/gpg | \
gpg --dearmor | \
sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

# Verify the GPG key's fingerprint
gpg --no-default-keyring \
--keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg \
--fingerprint

# Add the official HashiCorp Linux repository
echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list

# Update and install Terraform
sudo apt update

# Install Terraform version
echo "Installing Terraform version ${TF_VERSION}..."
sudo apt install -y terraform=${TF_VERSION}

# verify installation
echo "Verify Terraform installation..."
terraform -version

